
name: Revendedor WA - procesar Drive y Telegram

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "bot_telegram.py"
      - "procesar_imagenes.py"
      - "script_editor.py"
      - "run_cloud_once.py"
      - ".github/workflows/revendedor-wa.yml"
  schedule:
    # Respaldo autónomo: GitHub consulta cada cinco minutos, en minuto distinto al cron de Cloudflare.
    - cron: '2-59/5 * * * *'

concurrency:
  group: revendedor-wa-cloud
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  procesar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REVENDOR_CLOUD_MODE: "1"
      CLOUD_DRIVE_INTERVAL_SECONDS: "45"
      PUBLISHER_TELEGRAM_BOT_TOKEN: ${{ secrets.PUBLISHER_TELEGRAM_BOT_TOKEN }}
      PUBLISHER_TELEGRAM_CHAT_ID: ${{ secrets.PUBLISHER_TELEGRAM_CHAT_ID }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      DRIVE_FOLDER_INPUT: ${{ secrets.DRIVE_FOLDER_INPUT }}
      DRIVE_FOLDER_PROCESSED: ${{ secrets.DRIVE_FOLDER_PROCESSED }}
      DRIVE_FOLDER_OUTPUT: ${{ secrets.DRIVE_FOLDER_OUTPUT }}
      GANANCIA_PORCENTAJE: "30"
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar Tesseract si falta
        shell: bash
        run: |
          NEED_INSTALL=0
          if ! command -v tesseract >/dev/null 2>&1; then NEED_INSTALL=1; fi
          if [ "$NEED_INSTALL" -eq 0 ] && ! tesseract --list-langs 2>/dev/null | grep -qx spa; then NEED_INSTALL=1; fi
          if [ "$NEED_INSTALL" -eq 1 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng
          fi
      - name: Instalar dependencias Python
        run: pip install -r requirements.txt
      - name: Crear archivos OAuth temporales desde secretos
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          for env_name, filename in (("GOOGLE_CREDENTIALS_JSON", "credentials.json"), ("GOOGLE_TOKEN_JSON", "token.json")):
              value = os.environ.get(env_name, "")
              if not value.strip():
                  raise SystemExit(f"Falta el secreto {env_name} en Settings > Secrets and variables > Actions.")
              Path(filename).write_text(value, encoding="utf-8")
          PY
      - name: Comprobar identidad del bot de Telegram y modo de recepción
        env:
          PUBLISHER_TELEGRAM_BOT_TOKEN: ${{ secrets.PUBLISHER_TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ.get("PUBLISHER_TELEGRAM_BOT_TOKEN", "").strip()
          if not token:
              raise SystemExit("Falta el secreto PUBLISHER_TELEGRAM_BOT_TOKEN.")
          base = f"https://api.telegram.org/bot{token}"
          me = requests.get(f"{base}/getMe", timeout=20)
          me.raise_for_status()
          data = me.json()
          if not data.get("ok"):
              raise SystemExit("Telegram rechazó el token del publicador.")
          bot = data["result"]
          webhook_response = requests.get(f"{base}/getWebhookInfo", timeout=20)
          webhook_response.raise_for_status()
          webhook = webhook_response.json().get("result", {})
          print(f"Bot de PUBLICACIÓN configurado: @{bot.get('username', 'sin_usuario')} (ID {bot.get('id')}).")
          if webhook.get("url"):
              raise SystemExit("Este token tiene un webhook activo. getUpdates no puede funcionar al mismo tiempo; no se modificó el webhook.")
          print("Recepción por getUpdates habilitada: no hay webhook activo en este token.")
          PY
      - name: Comprobar disponibilidad de IA visual sin mostrar claves
        run: |
          python - <<'PY'
          import os
          gemini = bool(os.environ.get("GEMINI_API_KEY", "").strip())
          openrouter = bool(os.environ.get("OPENROUTER_API_KEY", "").strip())
          if gemini:
              print("IA visual Gemini: configurada.")
          if openrouter:
              print("IA visual OpenRouter: configurada; se usará solo modelo gratuito como respaldo.")
          if not gemini and not openrouter:
              print("ADVERTENCIA: no hay clave de IA visual; solo funcionará el OCR, no el análisis visual.")
          PY
      - name: Validar sintaxis del sistema
        run: python -m py_compile bot_telegram.py procesar_imagenes.py script_editor.py config.py run_cloud_once.py
      - name: Ejecutar una pasada de Telegram y Drive
        run: python run_cloud_once.py
